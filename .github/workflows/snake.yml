name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *"   # generuje každý den
  workflow_dispatch:         # lze spustit ručně

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: Aronis19
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake
        uses: actions/upload-artifact@v3
        with:
          name: snake-files
          path: dist
