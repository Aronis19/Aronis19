name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *"   # generuje každý den
  workflow_dispatch:         # umožňuje ruční spuštění

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checkout repo
      - uses: actions/checkout@v3

      # generování hada
      - uses: Platane/snk@v3
        with:
          github_user_name: Aronis19
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # upload artefaktů (nová verze)
      - name: Upload snake artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snake-files
          path: dist
